# Builds the Latent Image Camera companion APK (Capacitor) for Android.
# Download it from the run's "Artifacts" section and sideload it.
name: Latent Image Camera APK

on:
  push:
    paths:
      - 'latent-image/**'
      - '.github/workflows/latent-image-android.yml'
  workflow_dispatch:

jobs:
  apk:
    # 24.04 images ship the Android SDK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: latent-image
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: latent-image/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          # the legacy 'tools' package no longer exists; Gradle fetches the platform it needs
          packages: 'platform-tools'

      - name: Install
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Unit tests
        run: npx vitest run

      - name: Build phone web bundle and sync Capacitor
        run: npm run android:sync

      - name: Assemble debug APK
        working-directory: latent-image/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk latent-image-camera.apk

      - uses: actions/upload-artifact@v5
        with:
          name: latent-image-camera-apk
          path: latent-image/latent-image-camera.apk
          if-no-files-found: error
